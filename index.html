
<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI On-Call Engineer Lite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
</head>
<body class="bg-dark text-light">
  <nav class="navbar border-bottom border-secondary mb-4">
    <div class="container">
      <span class="navbar-brand fw-semibold">AI On-Call Engineer Lite <span class="badge text-bg-secondary ms-1">B3</span></span>
      <button id="simBtn" class="btn btn-primary btn-sm" onclick="simulateIncident()">Simulate Live Incident</button>
    </div>
  </nav>
  <main class="container pb-5" style="max-width: 900px;">
    <div class="row g-3 mb-4">
      <div class="col-4"><div class="card bg-body-tertiary border-secondary"><div class="card-body py-2"><div class="small text-secondary">Incidents</div><div id="statTotal" class="fs-4 fw-bold">0</div></div></div></div>
      <div class="col-4"><div class="card bg-body-tertiary border-secondary"><div class="card-body py-2"><div class="small text-secondary">Safe Auto-Fixes</div><div id="statSafe" class="fs-4 fw-bold text-success">0</div></div></div></div>
      <div class="col-4"><div class="card bg-body-tertiary border-secondary"><div class="card-body py-2"><div class="small text-secondary">Avg Triage</div><div id="statAvg" class="fs-4 fw-bold">0 ms</div></div></div></div>
    </div>
    <div id="feed" class="d-flex flex-column gap-3"></div>
  </main>
  <script>
    const samples = [
      ["2026-11-25 03:04:11 ERROR api-gateway OSError: [Errno 48] Address already in use ('0.0.0.0', 8000)", "2026-11-25 03:04:12 CRITICAL api-gateway Worker failed to bind socket"],
      ["2026-11-25 03:08:22 ERROR billing-worker sqlite3.OperationalError: database is locked", "2026-11-25 03:08:23 ERROR billing-worker Retry 3/3 failed while writing invoice"],
      ["2026-11-25 03:12:05 ERROR ingress-proxy ssl.SSLCertVerificationError: certificate verify failed: certificate has expired"]
    ];
    let idx = 0;
    const esc = s => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };
    async function simulateIncident() {
      const btn = document.getElementById("simBtn"); btn.disabled = true;
      try {
        await fetch("/triage", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ logs: samples[idx++ % samples.length] }) });
        await loadIncidents();
      } finally { btn.disabled = false; }
    }
    async function loadIncidents() {
      const items = await (await fetch("/incidents")).json();
      document.getElementById("statTotal").textContent = items.length;
      document.getElementById("statSafe").textContent = items.filter(i => i.verification_status === "verified_safe_fix").length;
      const avg = items.length ? Math.round(items.reduce((a, b) => a + (Number(b.triage_ms) || 0), 0) / items.length) : 0;
      document.getElementById("statAvg").textContent = `${avg} ms`;
      document.getElementById("feed").innerHTML = items.map(i => {
        const safe = i.verification_status === "verified_safe_fix";
        return `<div class="card bg-body-tertiary border-secondary"><div class="card-body">
          <span class="badge text-bg-danger me-1">${esc(i.severity || "P2")}</span>
          <span class="badge ${safe ? "text-bg-success" : "text-bg-warning"}">${esc(i.verification_status)}</span>
          <h5 class="card-title mt-2">${esc(i.root_cause)}</h5>
          <p class="small mb-2"><strong>Fix:</strong> <code>${esc(i.proposed_fix)}</code></p>
          <pre class="bg-black p-2 rounded small mb-0 text-secondary">${esc(i.log_excerpt)}</pre>
        </div></div>`;
      }).join("");
    }
    loadIncidents();
  </script>
</body>
</html>
